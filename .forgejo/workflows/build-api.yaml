name: build-docker

on:
  push:
    branches:
      - "develop"
    tags:
      - "v*.*.*"

jobs:
  build:
    runs-on: docker
    container: ghcr.io/catthehacker/ubuntu:act-24.04
    steps:
      - uses: https://platform.sunet.se/actions/checkout@v7

      - name: Login to Container Registry
        uses: https://platform.sunet.se/actions/login-action@v4
        with:
          registry: platform.sunet.se
          username: ci-sunet-cnaas
          password: ${{ secrets.CI_SUNET_CNAAS }}

      - name: Docker meta
        id: meta
        uses: https://platform.sunet.se/actions/metadata-action@v6
        with:
          images: |
            platform.sunet.se/cnaas/nms_api
          # generate Docker tags based on the following events/attributes
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/develop' }}
            type=sha

      - name: Set build args
        run: |
          echo "GIT_DATE=$(git log -1 --format=%cI HEAD)" >> $GITHUB_ENV

      - name: Build and Push
        uses: https://platform.sunet.se/actions/build-push-action@v6
        with:
          push: true
          file: docker/api/Dockerfile
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            GIT_COMMIT=${{ github.sha }}
            GIT_DATE=${{ env.GIT_DATE }}
            GIT_BRANCH=${{ github.ref_name }}
