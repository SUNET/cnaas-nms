name: build-docker

on:
  push:
    branches:
      - 'develop'
    tags-ignore:
      - '**'

jobs:
  build:
    runs-on: docker
    container: ghcr.io/catthehacker/ubuntu:act-22.04
    steps:
      - name: Checkout the repo
        uses: https://platform.sunet.se/actions/checkout@v4
      - name: Login to Container Registry
        uses: https://platform.sunet.se/actions/login-action@v3
        with:
          registry: platform.sunet.se
          username: ci-sunet-cnaas
          password: ${{ secrets.CI_SUNET_CNAAS }}
      - name: Build and Push
        uses: https://platform.sunet.se/actions/build-push-action@v6
        with:
          push: true
          file: docker/api/Dockerfile
          tags: platform.sunet.se/cnaas/nms_api:latest
