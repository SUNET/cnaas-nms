name: Changelog

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  changelog:
    name: Changelog notes for the current version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Check the changelog section for the version in version.py
        run: |
          version=$(sed -n 's/^__version__ = "\(.*\)"$/\1/p' src/cnaas_nms/version.py)
          .github/scripts/changelog-notes.sh "$version" > /dev/null
