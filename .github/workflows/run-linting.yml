on:
  push:
    branches:
      - "**"   # Match all branches
  pull_request:
    branches:
      - "**"

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Ruff
        run: pip install ruff

      - name: Run Ruff Linting
        run: ruff check src/

      # enable when we have a formatted code base
#      - name: Run Ruff Formatter
#        run: ruff format --check .
