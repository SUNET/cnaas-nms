services:

  #
  # CNaaS services
  #

  cnaas_api:
    image: cnaas-api
    build:
      context: ..
      dockerfile: docker/api/Dockerfile
    ports:
      - 443:1443
    networks:
      - cnaas
    environment:
      - GITREPO_TEMPLATES
      - GITREPO_SETTINGS
      - COVERAGE
      - NO_EQUIPMENTTEST
      - USERNAME_DHCP_BOOT
      - PASSWORD_DHCP_BOOT
      - USERNAME_DISCOVERED
      - PASSWORD_DISCOVERED
      - USERNAME_INIT
      - PASSWORD_INIT
      - USERNAME_MANAGED
      - PASSWORD_MANAGED
      - EXTERNAL_TEST_CONTAINERS
      - PYTEST_SETTINGS_CLONED
      - PYTEST_TEMPLATES_CLONED
      - JWT_AUTH_TOKEN
      - JWT_SECRET_KEY
      - PERMISSIONS_DISABLED=True
    depends_on:
      - "cnaas_postgres"
      - "cnaas_redis"
    volumes:
      - type: volume
        source: cnaas-templates
        target: /opt/cnaas/templates
      - type: volume
        source: cnaas-settings
        target: /opt/cnaas/settings
      - type: volume
        source: cnaas-jwtcert
        target: /opt/cnaas/jwtcert
      - type: volume
        source: cnaas-cacert
        target: /opt/cnaas/cacert

  #
  # Databases
  #

  cnaas_postgres:
    image: cnaas-postgres-test
    build:
      context: ./postgres/
      args:
        - SQLFILE=nms_test.sql
    volumes:
      - cnaas-postgres-data:/var/lib/postgresql/data
    environment:
      - POSTGRES_USER=cnaas
      - POSTGRES_PASSWORD=cnaas
      - POSTGRES_DB=cnaas
    networks:
      - cnaas

  cnaas_redis:
    image: cnaas-redis
    build: ./redis/
    networks:
      - cnaas

networks:
  cnaas:
    driver: bridge
    name: cnaas
    ipam:
      config:
      - subnet: 172.30.0.0/24
    driver_opts:
      com.docker.network.bridge.name: br-cnaas

volumes:
  cnaas-templates:
  cnaas-settings:
  cnaas-postgres-data:
  cnaas-jwtcert:
  cnaas-cacert:
