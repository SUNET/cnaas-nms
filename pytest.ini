[pytest]
testpaths: src
pythonpath: src
markers =
    integration: mark a test that will only run on a fully integrated CNaaS-NMS deployment
    equipment: mark a test that requires live equipment to be available for testing

filterwarnings =
    # Treat all warnings as errors unless explicitly ignored below.
    error
    # Keep our own deprecations strict; ignore deprecation noise from third-party dependencies.
    ignore::DeprecationWarning:^(?!cnaas_nms(\.|$)).*
    # Keep our own user warnings strict; ignore third-party user warnings (e.g. napalm/pkg_resources, nornir).
    ignore::UserWarning:^(?!cnaas_nms(\.|$)).*

